# Display maintenance uses the per-device key kept in the secure handoff vault.
# This remains usable over the maintenance AP without exposing a shared password.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowTcpForwarding yes
