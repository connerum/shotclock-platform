# Recovery keys are stored in the handoff vault. Password-based Internet SSH is
# disabled because this host receives continuous automated login attempts.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PubkeyAuthentication yes
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
AllowTcpForwarding yes
ClientAliveInterval 20
ClientAliveCountMax 3
