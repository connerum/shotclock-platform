name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Validate migrations on an empty database
        env:
          DATABASE_URL: file:${{ runner.temp }}/courtcast-ci.db
        run: |
          pnpm exec prisma validate
          pnpm exec prisma migrate deploy
      - run: pnpm test
      - run: pnpm check:secrets
      - name: Validate shell scripts
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Build all applications
        env:
          DATABASE_URL: file:${{ runner.temp }}/courtcast-ci.db
          AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
          SERVER_URL: http://127.0.0.1:3000
        run: pnpm build
      - run: pnpm audit --prod --audit-level high
